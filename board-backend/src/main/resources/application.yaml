spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: board-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/board?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
